name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc alone fails on a clean checkout: Next generates ambient route
      # types (e.g. LayoutProps) into .next/types on dev/build/typegen, and
      # they don't exist until something creates them.
      - run: npx next typegen
      - run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  docker-build-and-scan:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t snapshare:${{ github.sha }} .
      - name: Scan image with Trivy
        # Pinned by commit SHA, not a tag: this action's tags (0.0.1-0.34.2)
        # were compromised in a March 2026 supply-chain attack that injected
        # a credential stealer. v0.36.0 is confirmed clean.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snapshare:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  release-please:
    runs-on: ubuntu-latest
    needs: docker-build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # contents: write to open/update the release PR and, once it's merged,
    # create the tag and GitHub Release; pull-requests: write for the PR
    # itself. Unlike the old semantic-release job, this never pushes
    # straight to main — main's branch protection requires changes to land
    # through a PR, and the release PR merge is what actually cuts a
    # release.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned by commit SHA, not a tag — same rationale as the Trivy action
      # above: a floating major-version tag with contents/PR write access is
      # exactly the shape of the supply-chain attack that hit Trivy's tags.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # Must be a real token, not secrets.GITHUB_TOKEN: GitHub doesn't
          # trigger other workflow runs for pushes/PRs authored by the
          # default token (anti-recursion guard), so the release PR this
          # action opens would never get the lint/typecheck/test/
          # docker-build-and-scan checks main's branch protection requires,
          # and could never be merged. RELEASE_PLEASE_TOKEN is a
          # repo-scoped PAT for exactly this.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
