apiVersion: apps/v1
kind: Deployment
metadata:
  name: snapshare
  labels: { app: snapshare }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: { app: snapshare }
  template:
    metadata:
      labels: { app: snapshare }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: snapshare }
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: snapshare
          image: IMAGE_PLACEHOLDER   # replaced by the pipeline with ghcr.io/<repo>:<commit SHA>
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: snapshare-secrets
          env:
            # Métricas por OTLP al receptor nativo de Prometheus (requiere
            # enableOTLPReceiver en el Prometheus de monitoring). Solo métricas:
            # se usa la variable específica para no enviar trazas ahí.
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://kps-prometheus.monitoring:9090/api/v1/otlp/v1/metrics
            - name: OTEL_EXPORTER_OTLP_METRICS_PROTOCOL
              value: http/protobuf
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "30000"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=pedro-snapshare,deployment.environment=prod
          # startup/readiness usan /api/health (comprueba Redis); liveness solo TCP
          # para no reiniciar la app cuando Redis falla.
          startupProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 3000 }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: snapshare
spec:
  selector: { app: snapshare }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: snapshare
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: snapshare }
