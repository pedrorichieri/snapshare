# Redis + REST shim so that UPSTASH_REDIS_REST_URL=http://srh:80 resolves inside the namespace.
# SRH authenticates with the same UPSTASH_REDIS_REST_TOKEN stored in snapshare-secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      # Evita que K8s inyecte SRH_PORT=tcp://... y rompa a srh
      enableServiceLinks: false
      containers:
        - name: redis
          image: redis:alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srh
spec:
  replicas: 1
  selector:
    matchLabels: { app: srh }
  template:
    metadata:
      labels: { app: srh }
    spec:
      # Evita que K8s inyecte SRH_PORT=tcp://... y rompa a srh
      enableServiceLinks: false
      containers:
        - name: srh
          image: hiett/serverless-redis-http:latest
          ports: [{ containerPort: 80 }]
          env:
            - name: SRH_MODE
              value: env
            - name: SRH_CONNECTION_STRING
              value: redis://redis:6379
            - name: SRH_TOKEN
              valueFrom:
                secretKeyRef: { name: snapshare-secrets, key: UPSTASH_REDIS_REST_TOKEN }
---
apiVersion: v1
kind: Service
metadata:
  name: srh
spec:
  selector: { app: srh }
  ports: [{ port: 80, targetPort: 80 }]
